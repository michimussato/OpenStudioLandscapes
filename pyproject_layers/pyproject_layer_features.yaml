project:
  dependencies:
  - OpenStudioLandscapes @ git+https://github.com/michimussato/OpenStudioLandscapes@v1.9.0-rc1
  optional-dependencies:
    pyproject:
    - OpenStudioLandscapesUtil-VersionBumper @ git+https://github.com/michimussato/OpenStudioLandscapesUtil-VersionBumper.git
tool:
  setuptools:
    include-package-data: true
    # This translates to:
    # package-dir = {"" = "src"}
    package-dir:
      ? ''
      : src