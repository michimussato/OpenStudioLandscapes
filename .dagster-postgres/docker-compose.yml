networks:
  openstudiolandscapes-dagster-postgres:
    name: network_openstudiolandscapes-dagster-postgres
services:
  openstudiolandscapes-dagster-postgres:
    container_name: openstudiolandscapes-dagster-postgres
    domainname: openstudiolandscapes.lan
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_USER: postgres
    hostname: openstudiolandscapes-dagster-postgres.openstudiolandscapes.lan
    image: docker.io/postgres:17
    networks:
    - openstudiolandscapes-dagster-postgres
    ports:
    - 2345:5432
    restart: unless-stopped
    volumes:
    - /home/michael/git/repos/OpenStudioLandscapes/.dagster-postgres/.postgres:/var/lib/postgresql/data:rw
