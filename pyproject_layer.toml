[project]
name = "OpenStudioLandscapes"
description = "A Toolkit to create dynamic Animation and VFX studio environments for robust automation and pipelines."
dependencies = [
    "importlib-metadata; python_version<\"3.8\"",
    "PyYAML",
    "snakemd",
    "gitpython",
    "dagster==1.9.11",
    "docker",
    "docker-compose-graph @ git+https://github.com/michimussato/docker-compose-graph.git@v1.0.0",
]

[project.urls]
Homepage = "https://github.com/michimussato/OpenStudioLandscapes"

[project.optional-dependencies]
sbom = [
    "OpenStudioLandscapes[graphviz]",
]
nox = [
    "OpenStudioLandscapes[testing]",
]
dagster_mysql = [
    "OpenStudioLandscapes[nox]",
    "dagster==1.9.11",
    "dagster-webserver==1.9.11",
]
dagster_postgres = [
    "OpenStudioLandscapes[nox]",
    "dagster==1.9.11",
    "dagster-postgres",
    "dagster-webserver==1.9.11",
]
dev = [
    "OpenStudioLandscapes[testing]",
    "OpenStudioLandscapes[lint]",
    "OpenStudioLandscapes[nox]",
    "OpenStudioLandscapes[sbom]",
    "OpenStudioLandscapes[coverage]",
    "OpenStudioLandscapes[readme]",
    "OpenStudioLandscapesUtil-VersionBumper @ git+https://github.com/michimussato/OpenStudioLandscapesUtil-VersionBumper.git"
]

[tool.setuptools]
include-package-data = true
# [tool.openstudiolandscapes.ayon]
# namespace = "OpenStudioLandscapes"
# package = "Ayon"
# constants = "constants.py"
# ...
#
# and so on. For now, there is no obvious
# additional value in doing so as
# long as the structure of all Features
# stays consistent
#packages = [
#    "OpenStudioLandscapes.engine"
#]
# for OpenStudioLandscapes.engine, we leave
# autodiscovery enabled for now. Otherwise,
# packages like OpenStudioLandscapes.engine.utils
# would have to be specified explicitly

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests"]
# [options.package_data]
# # * = *.txt, *.rst
# hello = *.msg
namespaces = true

[tool.dagster]
module_name = "OpenStudioLandscapes.engine.definitions"
project_name = "OpenStudioLandscapes"