# https://docs.dagster.io/guides/build/projects/workspaces/workspace-yaml


# https://docs.dagster.io/guides/build/projects/workspaces/workspace-yaml
# Assets can only be materialized together if they are defined in the same code location and share a partition space, or form a connected graph in which root assets share the same partitioning.
# - https://github.com/dagster-io/dagster/discussions/19184

# Because we want to be able to use the "Materialize All" button
# across all Code Locations, we must - for now - use the experimental
# `Defintions.merge()` feature and specify ONLY ONE SINGLE Code Location
# in this `workspace.yaml` file.
#
# An error we get in case we want to Materialize All across multiple
# Code Locations:
#
# Unable to Materialize
# Assets can only be materialized together if they are defined in
# the same code location and share a partition space, or form a
# connected graph in which root assets share the same partitioning.

load_from:
# Engine Code Locations
  - python_module:
      module_name: "OpenStudioLandscapes.engine.base.definitions"
      location_name: "OpenStudioLandscapes Engine (Base)"
  - python_module:
      module_name: "OpenStudioLandscapes.engine.compose_scopes.definitions"
      location_name: "OpenStudioLandscapes Engine (Compose Scopes)"
  - python_module:
      module_name: "OpenStudioLandscapes.engine.landscape_map.definitions"
      location_name: "OpenStudioLandscapes LandscapeMap"
# Features
  - python_module:
      module_name: "OpenStudioLandscapes.Kitsu.definitions"
      location_name: "OpenStudioLandscapes-Kitsu"



